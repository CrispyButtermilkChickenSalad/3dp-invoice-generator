const results = [];
function test(name, fn) {
  try { fn(); results.push({ name, passed: true }); }
  catch (error) { results.push({ name, passed: false, error: error.message }); }
}
function equal(actual, expected) { if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`${JSON.stringify(actual)} !== ${JSON.stringify(expected)}`); }
function near(actual, expected) { if (Math.abs(actual - expected) > 0.00001) throw new Error(`${actual} !== ${expected}`); }
async function asyncTest(name, fn) {
  try { await fn(); results.push({ name, passed: true }); }
  catch (error) { results.push({ name, passed: false, error: error.message }); }
}
async function rejects(fn, pattern) {
  try { await fn(); } catch (error) { if (pattern.test(error.message)) return; throw error; }
  throw new Error('Expected failure.');
}

const filaments = [{ id: 'f1', price: 20, spoolWeight: 1000 }];

  near(hourly.modelling, 125); near(hourly.subtotal - base.subtotal, 125);

await asyncTest('Corrupt offsets, truncation, runs, checksums and unsafe geometry fail explicitly', async () => {
  const file = ctbFixture(), raw = new Uint8Array(await file.arrayBuffer());
  new DataView(raw.buffer).setFloat32(8, 1e-30, true);
  equal((await inspectResin(new File([raw], 'tiny.ctb'))).geometry.widthMm, null);
  new DataView(raw.buffer).setUint32(64, 1000, true);
  await rejects(() => inspectResin(new File([raw], 'bad.ctb')), /layer table bounds/);
  await rejects(() => inspectResin(new File([new Uint8Array(30)], 'bad.ctb')), /Truncated/);
  const corrupt = ctbFixture({ corruptRun: true }), info = await inspectResin(corrupt);
  await rejects(() => reconstructResin(corrupt, { ...info.geometry, firstLayerHeightMm: 0.05 }), /exceed/);
  await rejects(() => ctbCoverage(new Uint8Array([255]), 4), /Truncated/);
  await rejects(() => ctbCoverage(new Uint8Array([1]), 4), /does not fill/);
  await rejects(() => reconstructionGeometry({}), /valid display/);
  await rejects(() => reconstructionGeometry({ widthMm: 10, heightMm: 20, pixelsX: 10000, pixelsY: 10000, layerHeightMm: 0.05 }), /40 million/);
  const zip = new Uint8Array(await (await sl1Fixture()).arrayBuffer());
  zip[40] ^= 1;
  await rejects(() => inspectResin(new File([zip], 'bad.sl1')), /checksum/);
  await rejects(() => inspectResin(new File([zip.slice(0, -2)], 'bad.sl1')), /complete ZIP/);
  await rejects(async () => inspectResin(await zipFixture({ 'other.ini': 'test' })), /missing config/);
});
